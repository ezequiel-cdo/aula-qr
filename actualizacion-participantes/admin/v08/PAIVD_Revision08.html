<!doctype html><html lang="es"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font:16px system-ui;background:#edf2f7;color:#172e4e;margin:0}main{max-width:900px;margin:auto;padding:18px}header,section{background:white;border-radius:12px;padding:20px;margin-bottom:16px}header{background:#173355;color:white}button,select,textarea{font:inherit;padding:10px;margin:6px 0;max-width:100%;box-sizing:border-box}button{background:#173355;color:white;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.5;cursor:default}textarea,select{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f9;padding:12px}label{display:block;margin:12px 0}#status{white-space:pre-wrap}li{margin:8px 0}
</style></head><body><main><header>PREPARA CANASTICA · PAIVD V0.8 ALFA<h1>Revisión institucional</h1><p id="modo">Verificando acceso…</p></header><section><button id="reload">Actualizar bandeja</button><label>Estado <select id="filter"><option value="">Todos</option><option>PENDIENTE</option><option>PENDIENTE_ASIGNACION</option><option>OBSERVADA</option><option>APROBADA</option><option>RECHAZADA</option></select></label><ul id="list"></ul><p id="status" role="status" aria-live="polite"></p></section><section id="detail" hidden><h2>Revisar solicitud</h2><p id="ref"></p><h3>Datos propuestos</h3><pre id="proposal"></pre><label>Seleccione el participante verificado<select id="candidate"></select></label><h3>Datos actuales</h3><pre id="current"></pre><label><input id="identity" type="checkbox"> Comprobé presencialmente la identidad.</label><label><input id="contacts" type="checkbox"> Comprobé efectivamente los contactos y su autorización; no implica verificar WhatsApp.</label><label>Observación obligatoria<textarea id="note" maxlength="500" rows="3"></textarea></label><button data-op="APROBADA">Aprobar y aplicar</button> <button data-op="OBSERVADA">Observar</button> <button data-op="RECHAZADA">Rechazar</button><p>La aprobación alfa solo admite primeros contactos, sin correcciones académicas.</p></section></main><script>
const $=x=>document.getElementById(x);let rows=[],selected='',detail=null,busy=false,seq=0;
const rpc=(fn,...args)=>new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...args));
function status(s){$('status').textContent=s}
function render(){const list=$('list');list.replaceChildren();rows.filter(r=>!$('filter').value||r.estado===$('filter').value).forEach(r=>{const li=document.createElement('li'),b=document.createElement('button');b.textContent=r.estado+' · '+r.fecha+' · '+r.id;b.disabled=!['PENDIENTE','PENDIENTE_ASIGNACION','OBSERVADA'].includes(r.estado)||r.version!=='0.7';b.onclick=()=>openDetail(r.id);li.append(b);list.append(li)});if(!list.children.length)list.textContent='No hay solicitudes para este filtro.'}
async function load(){try{const r=await rpc('PA8_Listar');$('modo').textContent='Entorno: '+r.modo;rows=r.solicitudes;render();status('Solicitudes: '+rows.length)}catch(e){status(e.message)}}
function current(){const c=detail?.candidatos.find(x=>x.id===$('candidate').value);$('current').textContent=c?JSON.stringify({municipio:c.municipio,sector:c.sector,contactos:c.contactos},null,2):'Seleccione un candidato.';$('identity').checked=false;$('contacts').checked=false}
async function openDetail(id){if(busy)return;const n=++seq;$('detail').hidden=true;try{const d=await rpc('PA8_Detalle',id);if(n!==seq)return;selected=id;detail=d;$('ref').textContent=id;const j=d.propuesta;$('proposal').textContent=JSON.stringify({nombre:j.identificacion.nombre,curso:j.identificacion.curso,seccion:j.identificacion.seccion,confirmacion:j.confirmacion,correccion:j.correccion,contactos:j.contactos,municipio:j.municipio,sector:j.sector},null,2);$('candidate').replaceChildren(new Option('Seleccione…',''));d.candidatos.forEach(c=>$('candidate').append(new Option(c.nombre+' · '+c.oficial,c.id)));$('note').value='';current();$('detail').hidden=false;status('Solicitud cargada.')}catch(e){status(e.message)}}
async function decide(op){if(busy||!selected)return;const nota=$('note').value.trim();if(!nota){status('Escriba una observación.');return}if(op==='APROBADA'&&(!$('candidate').value||!$('identity').checked||!$('contacts').checked)){status('Complete la verificación presencial.');return}if(!confirm('Confirmar decisión: '+op+'?'))return;busy=true;document.querySelectorAll('[data-op]').forEach(b=>b.disabled=true);try{const r=await rpc('PA8_Decidir',{id:selected,candidato:$('candidate').value,identidad:$('identity').checked,contactos:$('contacts').checked,metodo:'PRESENCIAL',nota,accion:op});$('detail').hidden=true;selected='';await load();status('Decisión registrada: '+r.estado)}catch(e){status(e.message+' — Actualice la bandeja antes de reintentar.')}finally{busy=false;document.querySelectorAll('[data-op]').forEach(b=>b.disabled=false)}}
$('reload').onclick=load;$('filter').onchange=render;$('candidate').onchange=current;document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>decide(b.dataset.op));load();
</script></body></html>
