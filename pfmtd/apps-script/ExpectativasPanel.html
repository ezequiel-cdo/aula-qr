<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- PFMTTD ExpectativasPanel v1.0 · 2026-11-15 · Recuperación para cierre, solo aprobadas -->
<style>body{font:1rem/1.5 system-ui;background:#f2f6fe;color:#112544;margin:0;padding:1rem}h1{color:#1137aa;font-size:clamp(1.4rem,3vw,2rem)}button{background:#153ea9;border:0;border-radius:9px;color:white;font:inherit;padding:.8rem;cursor:pointer}button:focus-visible{outline:3px solid orange}.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}.card{border:1px solid #d1def1;background:#fff;padding:1rem;border-radius:10px}.card h2{color:#153ea9;font-size:1rem;margin:.2rem 0}.card p{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#52627c}</style></head><body>
<div class="top"><div><small>PFMTTD · Cierre simulado</small><h1>Recuperamos nuestras expectativas</h1></div><button id="refresh">Actualizar</button></div>
<p id="status" role="status">Consultando expectativas…</p><div id="lista" class="grid"></div>
<p><small>Se proyectan solo las filas marcadas SI en «Proyectar» de la hoja privada. El grupo contrasta expectativas con evidencias observables de esta práctica, sin afirmar que se impartieron 80 horas.</small></p>
<script>(function(){const out=document.querySelector('#lista'),status=document.querySelector('#status'),btn=document.querySelector('#refresh');let busy=false;function refresh(){if(busy)return;busy=true;btn.disabled=true;status.textContent='Actualizando…';
google.script.run.withSuccessHandler(r=>{busy=false;btn.disabled=false;out.replaceChildren();const items=Array.isArray(r.items)?r.items:[];for(const item of items){const c=document.createElement('article');c.className='card';const a=document.createElement('h2');a.textContent='Programa de 80 horas';const p=document.createElement('p');p.textContent=item.programa;const b=document.createElement('h2');b.textContent='Práctica de 30 minutos';const q=document.createElement('p');q.textContent=item.practica;c.append(a,p,b,q);out.appendChild(c)}status.textContent=items.length+' expectativas disponibles para contrastar.';}).withFailureHandler(e=>{busy=false;btn.disabled=false;status.textContent='No se pudo actualizar: '+(e?.message||'error')}).listarExpectativasProyectables()}
btn.onclick=refresh;refresh();setInterval(()=>{if(document.visibilityState==='visible')refresh()},15000)})();</script></body></html>
