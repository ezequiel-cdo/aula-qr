<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AulaQR | Practica</title><link rel="stylesheet" href="assets/css/styles.css"></head><body><main class="container"><nav><a href="index.html">← Ruta AulaQR</a></nav><p class="eyebrow">QR2 · PRACTICA</p><h1>Decide ante un caso cotidiano</h1><section class="panel"><p>Una persona utiliza la misma contraseña en su correo y en una tienda. Descubre que la tienda sufrió una filtración. ¿Qué le recomendarías?</p><label for="decision">Elige una recomendación</label><select id="decision"><option value="">Selecciona...</option><option value="a">Seguir usando ambas contraseñas</option><option value="b">Cambiar por contraseñas únicas y activar MFA</option><option value="c">Agregar un símbolo a la contraseña reutilizada</option></select><label for="reason">Justifica tu decisión</label><textarea id="reason" rows="4" placeholder="Mi recomendación se basa en..."></textarea><button id="check">Revisar mi decisión</button><p id="feedback" role="status"></p></section><nav class="next"><a href="qr3.html">Continuar a EVALÚATE →</a></nav></main><script src="assets/js/storage.js"></script><script>const d=document.getElementById('decision'),r=document.getElementById('reason'),f=document.getElementById('feedback');const old=AulaQRStorage.read('qr2');if(old){d.value=old.decision;r.value=old.reason}document.getElementById('check').onclick=()=>{if(!d.value||!r.value.trim()){f.textContent='Selecciona una opción y justifica tu decisión.';return}AulaQRStorage.write('qr2',{decision:d.value,reason:r.value});f.textContent=d.value==='b'?'Correcto: las contraseñas únicas reducen el riesgo de reutilización; MFA añade una capa de protección.':'Revisa el riesgo de reutilizar credenciales entre servicios. Lo recomendable es emplear contraseñas únicas y activar MFA.'}</script></body></html>
