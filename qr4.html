<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AulaQR | Retroalimenta</title><link rel="stylesheet" href="assets/css/styles.css"></head><body><main class="container"><nav><a href="index.html">← Ruta AulaQR</a></nav><p class="eyebrow">QR4 · RETROALIMENTA</p><h1>Reflexiona y transfiere</h1><form id="reflection" class="panel"><label for="change">¿Qué cambió entre lo que pensabas antes y ahora?</label><textarea id="change" required rows="3"></textarea><label for="transfer">¿Cómo aplicarías lo aprendido en la vida real?</label><textarea id="transfer" required rows="3"></textarea><label for="rating">¿Qué tan clara resultó la experiencia?</label><select id="rating" required><option value="">Selecciona...</option><option>Muy clara</option><option>Clara</option><option>Necesita mejoras</option></select><label for="improve">¿Qué mejorarías de AulaQR?</label><textarea id="improve" rows="3"></textarea><button type="submit">Guardar reflexión final</button><p id="status" role="status"></p></form><nav class="next"><a href="index.html">Volver al QR Maestro →</a></nav></main><script src="assets/js/storage.js"></script><script>const form=document.getElementById('reflection'),ids=['change','transfer','rating','improve'],prior=AulaQRStorage.read('qr4');if(prior)ids.forEach(k=>document.getElementById(k).value=prior[k]||'');form.onsubmit=e=>{e.preventDefault();const data={};ids.forEach(k=>data[k]=document.getElementById(k).value);AulaQRStorage.write('qr4',data);document.getElementById('status').textContent='Reflexión guardada en este dispositivo. No se ha enviado al facilitador.'}</script></body></html>
